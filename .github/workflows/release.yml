name: Release

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Ninja Multi-Config"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.StartsWith("v") ? $tag.Substring(1) : $tag
          $packageName = "tslt-$version-windows-x64"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "build/Release/tslt.exe" "dist/tslt.exe"
          Copy-Item "config.ini.example" "dist/config.ini.example"
          Compress-Archive -Path "dist/*" -DestinationPath "$packageName.zip" -Force
          "PACKAGE_NAME=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PACKAGE_NAME }}.zip
          generate_release_notes: true
